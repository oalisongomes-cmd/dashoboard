const PESQ = {};
const PC = [];
const PF = [];
// ---------- CONSTANTES DE APOIO ----------
const MONTH_ORDER = ["jan","fev","mar","abr","mai","jun"];
const MONTH_SHORT = { jan:"JAN", fev:"FEV", mar:"MAR", abr:"ABR", mai:"MAI", jun:"JUN" };
const WEEK_LABELS = ["D","S","T","Q","Q","S","S"];

function fmtR(v){ return "R$ " + (Number(v)||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtN(v){ return (Number(v)||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtPct1(v){ return (Number(v)||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}) + "%"; }

function mlRange(pct){
  if (pct >= 25) return { label: "CRÍTICO", color: RD };
  if (pct >= 20) return { label: "ALTO", color: OR };
  if (pct >= 15) return { label: "MÉDIO", color: YL };
  return { label: "DENTRO DA META", color: GR };
}

// Retorna a visão de dados unificada para o mês selecionado (ou "tri" = acumulado 2026)
function getViewData(mF){
  if (mF === "tri") {
    return {
      label: Q1.label, req: Q1.req, comp: Q1.comp, eco: Q1.eco, pct: Q1.pct,
      ped: Q1.ped, forn: Q1.forn, obras: Q1.obras, nota: Q1.nota, pedVal: Q1.comp,
      cal: null, calDays: 0, firstDay: 0,
      obrasList: null, topForn: FORN_Q1, mat: null, isYear: true,
    };
  }
  const m = MESES[mF];
  return { ...m, isYear: false };
}

function mlForMonth(mF){
  if (mF === "tri") {
    const last = ML_EVO[ML_EVO.length-1];
    const totalV = ML_EVO.reduce((s,x)=>s+x.v,0);
    const totalComp = ML_EVO.reduce((s,x)=>s+x.total,0);
    return { pct: totalComp ? (totalV/totalComp*100) : 0, v: totalV, total: totalComp };
  }
  const idx = MONTH_ORDER.indexOf(mF);
  return ML_EVO[idx];
}

// ---------- MOTOR DE RISCO (dinâmico por mês) ----------
function buildRisk(mF){
  const data = getViewData(mF);
  const ml = mlForMonth(mF);
  const pesq = PESQ[mF];
  const critico = [], alto = [], medio = [], positivo = [];

  if (ml.pct > 20) critico.push(`MERCADO LIVRE EM ${fmtPct1(ml.pct)} DO COMPRADO — CONCENTRAÇÃO ACIMA DO LIMITE CRÍTICO`);
  else if (ml.pct >= 15) alto.push(`MERCADO LIVRE EM ${fmtPct1(ml.pct)} DO COMPRADO — ACIMA DA META DE 15%`);
  else positivo.push(`MERCADO LIVRE EM ${fmtPct1(ml.pct)} DO COMPRADO — DENTRO DA META (<15%)`);

  const fornList = data.topForn || [];
  const fornRuim = fornList.filter(f => f.na < 3.5);
  const fornMedio = fornList.filter(f => f.na >= 3.5 && f.na < 4.0);
  const fornBom = fornList.filter(f => f.na >= 4.0);
  if (fornRuim.length) critico.push(`${fornRuim.length} FORNECEDOR${fornRuim.length>1?"ES":""} COM NOTA ABAIXO DE 3,5 (${fornRuim.map(f=>f.n).slice(0,3).join(", ")}${fornRuim.length>3?"...":""})`);
  if (fornMedio.length) alto.push(`${fornMedio.length} FORNECEDOR${fornMedio.length>1?"ES":""} COM NOTA ENTRE 3,5 E 3,9`);
  if (fornBom.length) positivo.push(`${fornBom.length} FORNECEDOR${fornBom.length>1?"ES":""} APROVADO${fornBom.length>1?"S":""} COM NOTA ≥ 4,0`);

  const pctSaving = data.pct * 100;
  if (pctSaving < 8) critico.push(`ECONOMIA DO MÊS EM ${fmtPct1(pctSaving)} — ABAIXO DE 8%`);
  else if (pctSaving >= 10) positivo.push(`ECONOMIA DO MÊS EM ${fmtPct1(pctSaving)} — ACIMA DA META DE 10%`);

  if (data.mat) {
    const negativas = data.mat.filter(m => m.eco < 0);
    if (negativas.length) alto.push(`${negativas.length} CATEGORIA${negativas.length>1?"S":""} DE MATERIAL COM ECONOMIA NEGATIVA (${negativas.map(m=>m.cat).slice(0,3).join(", ")}${negativas.length>3?"...":""})`);
  }

  if (data.ped && data.forn) {
    const razao = data.ped / data.forn;
    if (razao > 2.5) medio.push(`PEDIDOS FRAGMENTADOS — MÉDIA DE ${fmtN(razao)} PEDIDOS POR FORNECEDOR`);
  }

  if (fornList.length) {
    const melhor = fornList.reduce((a,b)=> b.na > a.na ? b : a, fornList[0]);
    positivo.push(`MELHOR NOTA DO PERÍODO: ${melhor.n} (${fmtN(melhor.na)})`);
  }
  positivo.push(`${fmtR(data.eco)} ECONOMIZADOS NO PERÍODO`);

  if (pesq) {
    critico.push(`PIOR CRITÉRIO DA PESQUISA: ${pesq.pior}`);
    if (pesq.nps < 0) alto.push(`NPS BAIXO NA PESQUISA DE SATISFAÇÃO: ${pesq.nps}`);
    (pesq.fracos||[]).forEach(f => medio.push(`CRITÉRIO FRACO NA PESQUISA: ${f}`));
    if (pesq.obs) medio.push(`OBSERVAÇÃO DOS ENGENHEIROS: ${pesq.obs}`);
    positivo.push(`AVALIAÇÃO GERAL DOS FORNECEDORES NA PESQUISA: ${fmtN(pesq.geral)}`);
  }

  return { critico, alto, medio, positivo };
}

// ---------- CALENDÁRIO DE GASTOS ----------
function CalHeatmap({ cal, calDays, firstDay }){
  if (!cal) return null;
  const max = Math.max(1, ...cal.map(c=>c.v));
  const byDay = {};
  cal.forEach(c => byDay[c.d] = c.v);
  const cells = [];
  for (let i=0;i<firstDay;i++) cells.push(null);
  for (let d=1; d<=calDays; d++) cells.push(d);
  function colorFor(v){
    if (!v) return BD + "30";
    const t = v/max;
    if (t > 0.66) return GR;
    if (t > 0.33) return EM + "CC";
    return EM + "66";
  }
  return (
    <div>
      <div style={{display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:4, marginBottom:6}}>
        {WEEK_LABELS.map((w,i)=>(
          <div key={i} style={{textAlign:"center", fontSize:10, color:MT, letterSpacing:1}}>{w}</div>
        ))}
      </div>
      <div style={{display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:4}}>
        {cells.map((d,i)=>{
          if (d===null) return <div key={i} />;
          const v = byDay[d];
          return (
            <div key={i} title={v ? `DIA ${d}: ${fmtR(v)}` : `DIA ${d}`}
              style={{
                aspectRatio:"1", borderRadius:6, background: colorFor(v),
                display:"flex", alignItems:"center", justifyContent:"center",
                fontSize:10, color: v ? "#05080E" : MT, fontWeight: v?700:400,
                border: `1px solid ${BD}`,
              }}>
              {d}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ---------- CARD KPI ----------
function KpiCard({ label, value, sub, color }){
  return (
    <div style={{ background:CD, border:`1px solid ${BD}`, borderRadius:10, padding:"16px 18px", flex:1, minWidth:150 }}>
      <div style={{ fontSize:11, color:MT, letterSpacing:1.2, marginBottom:8, fontWeight:600 }}>{label}</div>
      <div style={{ fontSize:22, color: color||WH, fontWeight:700 }}>{value}</div>
      {sub && <div style={{ fontSize:12, color:SV, marginTop:4 }}>{sub}</div>}
    </div>
  );
}

function SectionTitle({ children }){
  return <div style={{ fontSize:13, color:WH, fontWeight:700, letterSpacing:0.5, marginBottom:14 }}>{children}</div>;
}

function Card({ children, style }){
  return <div style={{ background:CD, border:`1px solid ${BD}`, borderRadius:10, padding:18, ...style }}>{children}</div>;
}

// ---------- BLOCO MERCADO LIVRE ----------
function MLBlock({ mF }){
  const cur = mlForMonth(mF);
  const range = mlRange(cur.pct);
  if (mF === "tri") {
    const last = ML_EVO[ML_EVO.length-1];
    const prev = ML_EVO[ML_EVO.length-2];
    const subiu = prev && last.pct > prev.pct;
    return (
      <Card>
        <SectionTitle>MERCADO LIVRE — EVOLUÇÃO 2026</SectionTitle>
        <div style={{ display:"flex", alignItems:"center", gap:8, flexWrap:"wrap", marginBottom:12 }}>
          {ML_EVO.map((e,i)=>(
            <React.Fragment key={e.mes}>
              <div style={{ textAlign:"center" }}>
                <div style={{ fontSize:10, color:MT }}>{e.mes}</div>
                <div style={{ fontSize:15, fontWeight:700, color: mlRange(e.pct).color }}>{fmtPct1(e.pct)}</div>
              </div>
              {i < ML_EVO.length-1 && <div style={{ color:MT }}>→</div>}
            </React.Fragment>
          ))}
        </div>
        <div style={{ fontSize:12, color:SV }}>
          ACUMULADO DO ANO: <b style={{color:WH}}>{fmtPct1(cur.pct)}</b> do comprado via Mercado Livre.
          {subiu && <span style={{ color:OR, marginLeft:8 }}>⚠ ALTA NO ÚLTIMO MÊS — RETOMAR DIVERSIFICAÇÃO DE FORNECEDORES.</span>}
        </div>
      </Card>
    );
  }
  const idx = MONTH_ORDER.indexOf(mF);
  const prev = idx > 0 ? ML_EVO[idx-1] : null;
  const delta = prev ? cur.pct - prev.pct : null;
  const acumIdx = ML_EVO.slice(0, idx+1);
  const acumV = acumIdx.reduce((s,x)=>s+x.v,0);
  const acumTotal = acumIdx.reduce((s,x)=>s+x.total,0);
  const acumPct = acumTotal ? (acumV/acumTotal*100) : 0;
  return (
    <Card>
      <SectionTitle>MERCADO LIVRE — COMPARATIVO MENSAL</SectionTitle>
      <div style={{ display:"flex", gap:24, flexWrap:"wrap", alignItems:"center" }}>
        <div>
          <div style={{ fontSize:11, color:MT, letterSpacing:1 }}>STATUS DO MÊS</div>
          <div style={{ fontSize:24, fontWeight:700, color: range.color }}>{fmtPct1(cur.pct)}</div>
          <div style={{ fontSize:11, color: range.color, fontWeight:600 }}>{range.label}</div>
        </div>
        {prev && (
          <div>
            <div style={{ fontSize:11, color:MT, letterSpacing:1 }}>VS. MÊS ANTERIOR</div>
            <div style={{ fontSize:18, fontWeight:700, color: delta>0?RD:GR }}>
              {delta>0?"↑":"↓"} {fmtN(Math.abs(delta))} p.p.
            </div>
          </div>
        )}
        <div>
          <div style={{ fontSize:11, color:MT, letterSpacing:1 }}>ACUMULADO 2026</div>
          <div style={{ fontSize:18, fontWeight:700, color:WH }}>{fmtPct1(acumPct)}</div>
        </div>
        <div style={{ fontSize:11, color:SV, maxWidth:260 }}>
          Meta estratégica: reduzir a concentração do Mercado Livre para abaixo de 15% do comprado.
        </div>
      </div>
    </Card>
  );
}

// ---------- ABA PARETO ----------
function Pareto({ mF }){
  const d = getViewData(mF);
  const list = (d.topForn || []).slice().sort((a,b)=>b.v-a.v);
  const total = list.reduce((s,f)=>s+f.v,0);
  let acc = 0;
  const chartData = list.map(f => {
    acc += f.v;
    return { name: f.n.length>14?f.n.slice(0,14)+"…":f.n, v:f.v, acumPct: total? acc/total*100 : 0 };
  });
  const top1 = total? (list[0]?.v||0)/total*100 : 0;
  const top3 = total? list.slice(0,3).reduce((s,f)=>s+f.v,0)/total*100 : 0;
  const top5 = total? list.slice(0,5).reduce((s,f)=>s+f.v,0)/total*100 : 0;
  const ml = mlForMonth(mF);
  return (
    <div style={{ display:"flex", flexDirection:"column", gap:18 }}>
      <div style={{ display:"flex", gap:14, flexWrap:"wrap" }}>
        <KpiCard label="TOP 1 FORNECEDOR" value={fmtPct1(top1)} color={top1>25?RD:GR} />
        <KpiCard label="TOP 3 FORNECEDORES" value={fmtPct1(top3)} color={VL} />
        <KpiCard label="TOP 5 FORNECEDORES" value={fmtPct1(top5)} color={PK} />
        <KpiCard label="MERCADO LIVRE (META <15%)" value={fmtPct1(ml.pct)} color={mlRange(ml.pct).color} />
      </div>
      <Card>
        <SectionTitle>CURVA DE PARETO — {d.label}</SectionTitle>
        <ResponsiveContainer width="100%" height={340}>
          <ComposedChart data={chartData} margin={{ top:5, right:20, left:0, bottom:60 }}>
            <CartesianGrid strokeDasharray="3 3" stroke={BD} vertical={false} />
            <XAxis dataKey="name" stroke={MT} tick={{ fill:MT, fontSize:10 }} angle={-40} textAnchor="end" interval={0} height={80} />
            <YAxis yAxisId="l" stroke={MT} tick={{ fill:MT, fontSize:11 }} tickFormatter={v=>(v/1000)+"k"} />
            <YAxis yAxisId="r" orientation="right" stroke={MT} tick={{ fill:MT, fontSize:11 }} tickFormatter={v=>v+"%"} domain={[0,100]} />
            <Tooltip contentStyle={{ background:CD, border:`1px solid ${BD}`, borderRadius:8, color:WH }}
              formatter={(v,n)=> n==="acumPct" ? [fmtPct1(v),"% ACUMULADO"] : [fmtR(v),"COMPRADO"]} />
            <Bar yAxisId="l" dataKey="v" fill={VL} radius={[4,4,0,0]} />
            <Line yAxisId="r" type="monotone" dataKey="acumPct" stroke={CY} strokeWidth={2} dot={{ r:3, fill:CY }} />
          </ComposedChart>
        </ResponsiveContainer>
      </Card>
      <Card>
        <SectionTitle>MERCADO LIVRE — EVOLUÇÃO POR MÊS</SectionTitle>
        <ResponsiveContainer width="100%" height={220}>
          <BarChart data={ML_EVO} margin={{ top:5, right:20, left:0, bottom:5 }}>
            <CartesianGrid strokeDasharray="3 3" stroke={BD} vertical={false} />
            <XAxis dataKey="mes" stroke={MT} tick={{ fill:MT, fontSize:11 }} />
            <YAxis stroke={MT} tick={{ fill:MT, fontSize:11 }} tickFormatter={v=>v+"%"} />
            <Tooltip contentStyle={{ background:CD, border:`1px solid ${BD}`, borderRadius:8, color:WH }} formatter={v=>[fmtPct1(v),"% DO COMPRADO"]} />
            <Bar dataKey="pct" radius={[4,4,0,0]}>
              {ML_EVO.map((e,i)=><Cell key={i} fill={mlRange(e.pct).color} />)}
            </Bar>
          </BarChart>
        </ResponsiveContainer>
      </Card>
    </div>
  );
}

// ---------- ABA RISCO ----------
function RiskGroup({ title, icon, color, items }){
  return (
    <Card style={{ flex:"1 1 280px" }}>
      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:12 }}>
        <div style={{ fontSize:13, fontWeight:700, color:WH }}>{icon} {title}</div>
        <div style={{ background:color+"22", color:color, borderRadius:20, padding:"2px 10px", fontSize:12, fontWeight:700 }}>{items.length}</div>
      </div>
      {items.length===0 ? (
        <div style={{ fontSize:12, color:MT }}>NENHUM ITEM NESTA CATEGORIA</div>
      ) : items.map((it,i)=>(
        <div key={i} style={{ fontSize:12.5, color:TX, padding:"7px 0", borderBottom: i<items.length-1?`1px solid ${BD}55`:"none" }}>• {it}</div>
      ))}
    </Card>
  );
}

function Risco({ mF }){
  const risk = useMemo(()=>buildRisk(mF), [mF]);
  return (
    <div style={{ display:"flex", flexDirection:"column", gap:18 }}>
      <div style={{ display:"flex", gap:18, flexWrap:"wrap" }}>
        <RiskGroup title="CRÍTICO" icon="🔴" color={RD} items={risk.critico} />
        <RiskGroup title="ALTO" icon="🟠" color={OR} items={risk.alto} />
      </div>
      <div style={{ display:"flex", gap:18, flexWrap:"wrap" }}>
        <RiskGroup title="MÉDIO" icon="🟡" color={YL} items={risk.medio} />
        <RiskGroup title="POSITIVO" icon="🟢" color={GR} items={risk.positivo} />
      </div>
      <Card>
        <SectionTitle>PLANO DE AÇÃO</SectionTitle>
        <div style={{ fontSize:12.5, color:TX }}>
          Priorizar a diversificação de fornecedores nas categorias com maior concentração no Mercado Livre e acompanhar
          de perto os fornecedores com nota abaixo de 4,0, mantendo o ritmo de negociação que vem sustentando o saving do período.
        </div>
      </Card>
    </div>
  );
}

// ---------- APP ----------
function Dashboard(){
  const [tab, setTab] = useState("overview");

  function changeTab(t){ setTab(t); setSelectedObra(null); }

}
